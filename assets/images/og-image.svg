<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Definitions -->
  <defs>
    <linearGradient id="logoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Black Background -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Subtle Decorative Elements -->
  <circle cx="80" cy="80" r="60" fill="#7C3AED" opacity="0.05"/>
  <circle cx="1120" cy="550" r="100" fill="#A78BFA" opacity="0.05"/>

  <!-- Logo Container with Glow -->
  <rect x="80" y="110" width="140" height="140" rx="20" fill="url(#logoGlow)"/>

  <!-- Logo Image (embedded) -->
  <image x="90" y="120" width="120" height="120" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='95' fill='none' stroke='%237C3AED' stroke-width='8'/%3E%3Ccircle cx='100' cy='100' r='75' fill='none' stroke='%23A78BFA' stroke-width='4' opacity='0.6'/%3E%3Ctext x='100' y='115' font-size='60' font-weight='bold' fill='%237C3AED' text-anchor='middle' font-family='Arial'%3ES%3C/text%3E%3C/svg%3E"/>

  <!-- Main Title -->
  <text x="280" y="155" font-size="68" font-weight="bold" fill="#FFFFFF" font-family="Fredoka, sans-serif" letter-spacing="1">
    Spacedevs
  </text>

  <!-- Subtitle -->
  <text x="280" y="210" font-size="28" fill="#A78BFA" font-family="Fredoka, sans-serif" letter-spacing="0.5">
    Inclusão Social através da Tecnologia
  </text>

  <!-- Accent Line -->
  <!-- <line x1="80" y1="250" x2="1120" y2="250" stroke="#7C3AED" stroke-width="2" opacity="0.6"/> -->

  <!-- Main Message Box -->
  <rect x="80" y="290" width="1040" height="220" rx="15" fill="rgba(124,58,237,0.08)" stroke="#7C3AED" stroke-width="1" opacity="0.4"/>

  <!-- Main Message -->
  <text x="600" y="350" font-size="48" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Fredoka, sans-serif">
    Aprenda, aprimore, planeje e
  </text>
  <text x="600" y="415" font-size="48" font-weight="bold" fill="#FFFFFF" text-anchor="middle" font-family="Fredoka, sans-serif">
    desenvolva softwares
  </text>

  <!-- Bottom tagline -->
  <text x="600" y="485" font-size="20" fill="#C4B5FD" text-anchor="middle" font-family="Outfit, sans-serif" opacity="0.9">
    Transforme seu futuro através da tecnologia
  </text>

  <!-- Footer Elements -->
  <text x="100" y="580" font-size="16" fill="#7C3AED" font-family="Outfit, sans-serif" font-weight="500">
    spacedevs.com.br
  </text>

  <!-- Social Indicator -->
  <text x="1100" y="580" font-size="16" fill="#A78BFA" text-anchor="end" font-family="Outfit, sans-serif" font-weight="500">
    @spacdevs
  </text>
</svg>
